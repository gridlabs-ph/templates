<style>
  :root {
    --bg:#f2f4f1; --card:#ffffff; --ink:#14261f; --muted:#52665c; --line:#c5d4cb; --field:#f6faf8;
    --accent:#1e6d54; --on:#ffffff; --rule:#dbe6e0; --rowline:#cfdcd4; --err:#a3261b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0f1512; --card:#1a221e; --ink:#e6ede8; --muted:#9fb3a8; --line:#35463d; --field:#121a16;
      --accent:#5fbf98; --on:#0b1a13; --rule:#2c3731; --rowline:#35463d; --err:#ff8a7d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--ink); font: 16px/1.5 Manrope, system-ui, sans-serif;
  }
  .card { width: 100%; max-width: 480px; background: var(--card); border-radius: 20px; overflow: hidden;
    box-shadow: 0 12px 40px rgba(20,60,45,.16); }
  .head { background: #1e6d54; padding: 28px 32px; display: flex; align-items: center; gap: 14px; }
  .logo { width: 62px; height: 62px; padding: 5px; border-radius: 12px; background: #fff; flex: none; }
  .logo svg { width: 100%; height: 100%; display: block; }
  .name { font-weight: 800; font-size: 22px; line-height: 1.1; color: #fff; }
  .tag { font-size: 13px; letter-spacing: .05em; color: #e3f3ea; margin-top: 2px; }
  .body { padding: 28px 32px 32px; display: flex; flex-direction: column; gap: 18px; }
  h1 { margin: 0; font-size: 26px; line-height: 1.15; font-weight: 800; }
  label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 8px; }
  input { width: 100%; height: 52px; padding: 0 16px; font: 700 17px ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink); background: var(--field);
    border: 1.5px solid var(--line); border-radius: 10px; }
  button { width: 100%; height: 52px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on);
    font: 800 16px Manrope, system-ui, sans-serif; cursor: pointer; margin-top: 18px; }
  button:disabled { opacity: .6; cursor: wait; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .note { font-size: 13px; line-height: 1.5; color: var(--muted); margin: 0; }
  #msg { margin: 0; min-height: 0; color: var(--err); font-size: 14px; font-weight: 600; }
  #results { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--rule); padding-top: 18px; }
  #results[hidden] { display: none; }
  .label { font-weight: 800; font-size: 12px; letter-spacing: .08em; color: var(--muted); }
  .folder { font-weight: 600; font-size: 13px; color: var(--muted); margin-top: 8px; }
  a.file { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px;
    border: 1.5px solid var(--rowline); border-radius: 10px; text-decoration: none; font-weight: 600;
    font-size: 14px; color: var(--ink); overflow-wrap: anywhere; }
  a.file svg { flex: none; color: var(--accent); }
  a.file:hover { border-color: var(--accent); }
  @media (max-width: 420px) { .head, .body { padding-left: 20px; padding-right: 20px; } }
</style>
</head>

  <div class="body">
    <h1>Download your template</h1>
    <form id="f">
      <label for="code">Access code</label>
      <input id="code" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX" required>
      <button id="go" type="submit">Unlock files</button>
    </form>
    <p id="msg" role="alert"></p>
    <p class="note">Thank you for your purchase. Download links expire after 15 minutes. Unlock again if one stops working.</p>
    <section id="results" hidden aria-label="Your files">
      <div class="label">YOUR FILES</div>
      <div id="files"></div>
      <p id="until" class="note"></p>
    </section>
  </div>
</main>

<script>
  // >>> EDIT 1 OF 1: replace with your Cloudflare Worker URL (no trailing slash) <<<
  const API = "https://katabang.support-gridlabs.workers.dev";

  const ICON = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>';
  const f = document.getElementById("f"), msg = document.getElementById("msg"),
        list = document.getElementById("files"), until = document.getElementById("until"),
        results = document.getElementById("results"), go = document.getElementById("go");

  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = ""; list.innerHTML = ""; until.textContent = ""; results.hidden = true;
    go.disabled = true;
    try {
      const res = await fetch(API + "/redeem", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: document.getElementById("code").value }),
      });
      const data = await res.json();
      if (!res.ok) { msg.textContent = data.error || "Something went wrong."; return; }
      let last = null;
      data.files.forEach((file) => {
        const i = file.name.lastIndexOf("/");
        const folder = i > -1 ? file.name.slice(0, i) : "";
        if (folder !== last) {
          const h = document.createElement("div"); h.className = "folder";
          h.textContent = folder || "Files"; list.appendChild(h); last = folder;
        }
        const a = document.createElement("a");
        a.className = "file"; a.href = file.url;
        const span = document.createElement("span"); span.textContent = file.name.slice(i + 1);
        a.appendChild(span); a.insertAdjacentHTML("beforeend", ICON);
        list.appendChild(a);
      });
      until.textContent = "Your code works until " + new Date(data.expires).toLocaleDateString() + ".";
      results.hidden = false;
    } catch {
      msg.textContent = "Could not reach the server. Check your connection and try again.";
    } finally {
      go.disabled = false;
    }
  });
</script>
